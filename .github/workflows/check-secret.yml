name: Verify demo secret
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check DINEDESK_DEMO_KEY is configured
        env:
          DINEDESK_DEMO_KEY: ${{ secrets.DINEDESK_DEMO_KEY }}
        run: |
          if [ -z "$DINEDESK_DEMO_KEY" ]; then
            echo "DINEDESK_DEMO_KEY is NOT configured"
            exit 1
          fi
          echo "DINEDESK_DEMO_KEY is configured"
